   <g id="text_1">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283d" x="25.812" y="32.4144" transform="rotate(-0 25.812 32.4144)">DECOMPOSITION / SMALLER PROBLEMS, CHECKABLE BOUNDS</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f79" x="60.966" y="126.976969" transform="rotate(-0 60.966 126.976969)">01  Investment master</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #14283d" transform="translate(60.966 149.922638)">Choose solar, wind and gas MW.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #14283d" transform="translate(60.966 164.668653)">Approximate scenario costs with θ.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #14283d" transform="translate(60.966 179.414669)">Investment + weighted θ = lower bound.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526cba" x="529.686" y="101.751769" transform="rotate(-0 529.686 101.751769)">02  Operating subproblems</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #14283d" transform="translate(529.686 124.697438)">12 season × growth scenarios</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #14283d" transform="translate(529.686 139.314547)">Hourly dispatch at fixed capacity</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #c85c32" x="529.686" y="245.895769" transform="rotate(-0 529.686 245.895769)">03  Dual information</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #14283d" transform="translate(529.686 268.841438)">Daily operating cost Q(x)</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #14283d" transform="translate(529.686 283.458547)">Capacity subgradient from LP duals</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f79" x="330.48" y="104.4864" transform="rotate(-0 330.48 104.4864)">trial capacity x</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #c85c32" transform="translate(233.597813 271.403081)">valid supporting cuts</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #c85c32" transform="translate(230.769609 283.8238)">θ ≥ Q(xᵏ) + gᵀ(x − xᵏ)</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283d" x="49.248" y="342.324" transform="rotate(-0 49.248 342.324)">Evaluate a feasible build → upper bound.  Repeat until the relative bound gap closes.</text>
