    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f79" x="430.965341" y="102.265938" transform="rotate(-0 430.965341 102.265938)">Choose the schedule</text>
   </g>
   <g id="text_24">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #14283d" transform="translate(430.965341 119.390406)">Binary u: unit on/off  ·  v: startup  ·  w: shutdown</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #14283d" transform="translate(430.965341 134.007516)">Continuous p: generation  ·  r: spinning reserve</text>
   </g>
   <g id="text_25">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526cba" x="430.965341" y="218.689938" transform="rotate(-0 430.965341 218.689938)">Solve with branch and bound</text>
   </g>
   <g id="text_26">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #14283d" transform="translate(430.965341 235.814406)">LP relaxation supplies a lower bound on cost.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #14283d" transform="translate(430.965341 250.431516)">Feasible integer schedules supply upper bounds.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #14283d" transform="translate(430.965341 265.048625)">Stop at the reported relative optimality gap.</text>
   </g>
   <g id="text_27">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #5c6f80" transform="translate(425.258523 301.297938)">Toy geometry: maximize x+y subject to 2x+y ≤ 4.5, x+2y ≤ 4.5.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #5c6f80" transform="translate(425.258523 311.375969)">The UC formulation minimizes cost; its bound direction is reversed.</text>
   </g>
   <g id="text_28">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283d" x="413.844886" y="27.877969" transform="rotate(-0 413.844886 27.877969)">02 / From unit commitment to MILP</text>
   </g>
  </g>
